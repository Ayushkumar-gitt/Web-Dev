<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity-Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <nav></nav>
        <section class="AllEle">
            <div class="todo elem" id="0">
                <img src="https://images.pexels.com/photos/6985001/pexels-photo-6985001.jpeg" alt="">
                <h2>TODO</h2>
            </div>
            <div class="dailyPlanner elem" id="1">
                <img src="https://images.pexels.com/photos/30933670/pexels-photo-30933670.jpeg" alt="">
                <h2>dailyPlanner</h2>
            </div>
            <div class="motivation elem" id="2">
                <img src="https://images.pexels.com/photos/35083547/pexels-photo-35083547.jpeg" alt="">
                <h2>motivation</h2>
            </div>
            <div class="pomodoro elem" id="3">
                <img src="https://images.pexels.com/photos/34742186/pexels-photo-34742186.jpeg" alt="">
                <h2>pomodoro</h2>
            </div>
            <div class="dailygoals elem" id="4">
                <img src="https://images.pexels.com/photos/28795078/pexels-photo-28795078.jpeg" alt="">
                <h2>Daily Goals</h2>
            </div>
        </section>

        <div class="fullelem full-todo">
            <div class="back" id="0">Close</div>
            <h2>TODO</h2>
            <div class="todo-container">
                <div class="addtask">
                    <form>
                        <input type="text" placeholder="Enter Task" name="" id="">
                        <textarea placeholder="Enter Details" name="" id=""></textarea>
                        <div class="checkbx">
                            <input type="checkbox" name="" id="checkbox">
                        <label for="checkbox">Mark as Important</label>
                        </div>
                        <button>Add task</button>
                    </form>
                </div>
                <div class="alltask">
                    <div class="task">
                        <h2>Gym jao lorem20</h2>
                        <button>Mark as completed</button>
                    </div>
                    <div class="task">
                        <h2>Gym jao lorem20</h2>
                        <button>Mark as completed</button>
                    </div>
                </div>
            </div>

        </div>
        <div class="fullelem full-dailyPlanner">
            <div class="back" id="1">Close</div>
            <h2>dailyPlanner</h2>
        </div>
        <div class="fullelem full-motivation">
            <div class="back" id="2">Close</div>
            <h2>motivation</h2>
        </div>
        <div class="fullelem full-pomodoro">
            <div class="back" id="3">Close</div>
            <h2>pomodoro</h2>
        </div>
        <div class="fullelem full-dailygoals">
            <div class="back" id="4">Close</div>
            <h2>Daily Goals</h2>
        </div>
    </main>
    <script src="./script.js"></script>
</body>

</html>
