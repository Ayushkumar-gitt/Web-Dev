<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="black"/>
    </marker>
    <style>
      .state-circle { fill: none; stroke: black; stroke-width: 2; }
      .state-double { fill: none; stroke: black; stroke-width: 3; }
      .state-label { font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font-size: 12px; fill: black; background: white; }
      .title { font-size: 18px; font-weight: bold; text-anchor: middle; }
      .legend { font-size: 11px; font-family: monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="white" stroke="#eee" stroke-width="1"/>

  <!-- Title -->
  <text x="500" y="40" class="title">DFA: Even number of 0s AND Odd number of 1s</text>

  <!-- Initial arrow -->
  <line x1="60" y1="250" x2="120" y2="250" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="70" y="230" style="font-size: 11px;">start</text>

  <!-- States: q0 (200, 250), q1 (700, 250), q2 (200, 500), q3 (700, 500) -->

  <!-- q0 (even 0s, even 1s) - initial state -->
  <circle cx="200" cy="250" r="40" class="state-circle"/>
  <text x="200" y="250" class="state-label">q0</text>
  <text x="200" y="270" style="font-size: 11px; text-anchor: middle;">(E,E)</text>

  <!-- q1 (even 0s, odd 1s) - ACCEPTING state -->
  <circle cx="700" cy="250" r="40" class="state-circle"/>
  <circle cx="700" cy="250" r="35" class="state-double"/>
  <text x="700" y="250" class="state-label">q1</text>
  <text x="700" y="270" style="font-size: 11px; text-anchor: middle;">(E,O)</text>

  <!-- q2 (odd 0s, even 1s) -->
  <circle cx="200" cy="500" r="40" class="state-circle"/>
  <text x="200" y="500" class="state-label">q2</text>
  <text x="200" y="520" style="font-size: 11px; text-anchor: middle;">(O,E)</text>

  <!-- q3 (odd 0s, odd 1s) -->
  <circle cx="700" cy="500" r="40" class="state-circle"/>
  <text x="700" y="500" class="state-label">q3</text>
  <text x="700" y="520" style="font-size: 11px; text-anchor: middle;">(O,O)</text>

  <!-- Transition Arrows -->

  <!-- q0 to q2 on 0 (left side, straight down) -->
  <path d="M 180 285 L 180 465" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="160" y="375" class="edge-label" style="fill: black;">0</text>

  <!-- q0 to q1 on 1 (top curved) -->
  <path d="M 240 240 Q 450 150 660 240" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="450" y="180" class="edge-label">1</text>

  <!-- q1 to q3 on 0 (right side, straight down) -->
  <path d="M 720 285 L 720 465" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="740" y="375" class="edge-label">0</text>

  <!-- q1 to q0 on 1 (bottom curved) -->
  <path d="M 660 260 Q 450 350 240 260" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="450" y="370" class="edge-label">1</text>

  <!-- q2 to q0 on 0 (left bottom, straight up) -->
  <path d="M 180 465 L 180 285" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="155" y="375" class="edge-label" style="fill: black;">0</text>

  <!-- q2 to q3 on 1 (bottom curved) -->
  <path d="M 240 510 Q 450 580 660 510" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="450" y="600" class="edge-label">1</text>

  <!-- q3 to q1 on 0 (right top, straight up) -->
  <path d="M 720 465 L 720 285" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="745" y="375" class="edge-label">0</text>

  <!-- q3 to q2 on 1 (top curved) -->
  <path d="M 660 490 Q 450 420 240 490" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="450" y="420" class="edge-label">1</text>

  <!-- Legend -->
  <rect x="50" y="600" width="900" height="80" fill="#e8f4f8" stroke="#1a8a96" stroke-width="2" rx="5"/>

  <text x="70" y="625" class="legend" style="font-weight: bold; font-size: 12px;">Legend:</text>
  <text x="70" y="648" class="legend">(E,E) = Even number of 0s, Even number of 1s</text>
  <text x="70" y="670" class="legend">(E,O) = Even number of 0s, Odd number of 1s  ← ACCEPTING STATE (Double Circle)</text>
  <text x="550" y="648" class="legend">(O,E) = Odd number of 0s, Even number of 1s</text>
  <text x="550" y="670" class="legend">(O,O) = Odd number of 0s, Odd number of 1s</text>

  <!-- Transition Table Title -->
  <text x="50" y="50" style="font-size: 12px; font-weight: bold;">State Transition Table:</text>
  <line x1="50" y1="60" x2="350" y2="60" stroke="black" stroke-width="1"/>

  <!-- Simple transition table -->
  <text x="50" y="85" style="font-size: 10px; font-family: monospace;">State │ Input 0 │ Input 1</text>
  <text x="50" y="100" style="font-size: 10px; font-family: monospace;">──────┼─────────┼────────</text>
  <text x="50" y="115" style="font-size: 10px; font-family: monospace;"> q0   │   q2    │   q1</text>
  <text x="50" y="130" style="font-size: 10px; font-family: monospace;"> q1*  │   q3    │   q0</text>
  <text x="50" y="145" style="font-size: 10px; font-family: monospace;"> q2   │   q0    │   q3</text>
  <text x="50" y="160" style="font-size: 10px; font-family: monospace;"> q3   │   q1    │   q2</text>
</svg>